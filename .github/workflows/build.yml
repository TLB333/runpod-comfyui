name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/lib/mono
          sudo rm -rf /usr/share/postgresql*
          sudo rm -rf /usr/lib/firefox
          sudo rm -rf /opt/microsoft
          sudo docker image prune -af
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tlb333
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Download LoRAs from Google Drive
        run: |
          pip install gdown
          mkdir -p loras ultralytics/bbox
          gdown --folder https://drive.google.com/drive/folders/1i1IsypoCBJLg4P0c3KAEwDeRzpeLEKyc -O loras/
          gdown --folder https://drive.google.com/drive/folders/1-oM8QQtnKm1rEa58q4N_C2Soa2lYZCoX -O ultralytics/bbox/
          df -h

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: tlb333/comfyui-runpod:latest
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          no-cache: true
