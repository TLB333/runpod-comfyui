name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tlb333
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Download LoRAs from Google Drive
        run: |
          pip install gdown
          mkdir -p loras ultralytics/bbox
          gdown --folder https://drive.google.com/drive/folders/1i1IsypoCBJLg4P0c3KAEwDeRzpeLEKyc -O loras/
          gdown --folder https://drive.google.com/drive/folders/1-oM8QQtnKm1rEa58q4N_C2Soa2lYZCoX -O ultralytics/bbox/

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: tlb333/comfyui-runpod:latest
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
